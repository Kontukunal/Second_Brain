<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Second Brain. | Habits</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="styles/main.css" />
    <link rel="stylesheet" href="styles/habits.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyDVoMf2JuGYaA0Y9Uu30g5doEjxj0SrYkY",
        authDomain: "noted-abfa8.firebaseapp.com",
        projectId: "noted-abfa8",
        storageBucket: "noted-abfa8.appspot.com",
        messagingSenderId: "871510309596",
        appId: "1:871510309596:web:2c03c5ed9413fd5c085219",
        measurementId: "G-W8X756LP8N",
      };
      firebase.initializeApp(firebaseConfig);
    </script>
  </head>
  <body class="light-theme">
    <div class="app">
      <header class="header">
        <div class="header-left">
          <h1>Second Brain.</h1>
          <div class="date-display" id="currentDate"></div>
        </div>
        <div class="header-right">
          <button id="themeToggle" class="theme-toggle">
            <span class="moon">🌙</span>
            <span class="sun">☀️</span>
          </button>
          <button class="logout-btn">Logout</button>
        </div>
      </header>

      <aside class="sidebar">
        <nav>
          <ul>
            <li>
              <a href="index.html" class="nav-link">
                <span class="icon">📆</span>
                <span class="text">Calendar</span>
              </a>
            </li>
            <li>
              <a href="todo.html" class="nav-link">
                <span class="icon">✅</span>
                <span class="text">To-Do</span>
              </a>
            </li>
            <li>
              <a href="journal.html" class="nav-link">
                <span class="icon">📔</span>
                <span class="text">Journal</span>
              </a>
            </li>
            <li>
              <a href="goals.html" class="nav-link">
                <span class="icon">🎯</span>
                <span class="text">Goals</span>
              </a>
            </li>
            <li class="active">
              <a href="habit.html" class="nav-link">
                <span class="icon">🔄</span>
                <span class="text">Habits</span>
              </a>
            </li>
            <li>
              <a href="mood.html" class="nav-link">
                <span class="icon">😊</span>
                <span class="text">Mood</span>
              </a>
            </li>
          </ul>
        </nav>
        <div class="quick-notes">
          <h3>Quick Notes</h3>
          <textarea placeholder="Write down quick thoughts..."></textarea>
        </div>
        <h4>Devloped by Kunal Mali</h4>
      </aside>

      <main class="main-content">
        <div class="content-header">
          <h2>Habit Tracker</h2>
          <button id="addHabitBtn" class="add-event-btn">+ Add Habit</button>
        </div>

        <div class="habit-view-controls">
          <button class="view-btn active" data-view="daily">Daily</button>
          <button class="view-btn" data-view="weekly">Weekly</button>
          <button class="view-btn" data-view="monthly">Monthly</button>
          <button class="view-btn" data-view="graph">Progress Graph</button>
        </div>

        <div class="chart-container">
          <canvas id="progressChart"></canvas>
        </div>

        <div class="habit-container" id="habitContainer">
          <!-- Habits will be rendered here -->
        </div>

        <!-- Habit Modal -->
        <div id="habitModal" class="modal">
          <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h3 class="modal-title">Add New Habit</h3>
            <form id="habitForm">
              <input type="hidden" id="habitId" />
              <div class="form-group">
                <label for="habitName">Habit Name</label>
                <input type="text" id="habitName" required />
              </div>
              <div class="form-group">
                <label for="habitCategory">Category</label>
                <select id="habitCategory">
                  <option value="health">Health</option>
                  <option value="productivity">Productivity</option>
                  <option value="learning">Learning</option>
                  <option value="mindfulness">Mindfulness</option>
                </select>
              </div>
              <div class="form-group">
                <label for="habitColor">Color</label>
                <select id="habitColor">
                  <option value="#4ade80">Green</option>
                  <option value="#60a5fa">Blue</option>
                  <option value="#f87171">Red</option>
                  <option value="#fbbf24">Yellow</option>
                  <option value="#a78bfa">Purple</option>
                </select>
              </div>
              <div class="form-group">
                <label for="habitReminder">Reminder Time</label>
                <input type="time" id="habitReminder" />
              </div>
              <div class="form-group">
                <label>
                  <input type="checkbox" id="habitWeekdays" checked />
                  Weekdays Only
                </label>
              </div>
              <button type="submit" class="submit-btn">Save Habit</button>
            </form>
          </div>
        </div>
      </main>
    </div>

    <script src="scripts/habits.js"></script>
  </body>
</html>
