<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Second Brain. | Goals</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="styles/main.css" />
    <link rel="stylesheet" href="styles/goals.css" />
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyDVoMf2JuGYaA0Y9Uu30g5doEjxj0SrYkY",
        authDomain: "noted-abfa8.firebaseapp.com",
        projectId: "noted-abfa8",
        storageBucket: "noted-abfa8.appspot.com",
        messagingSenderId: "871510309596",
        appId: "1:871510309596:web:2c03c5ed9413fd5c085219",
        measurementId: "G-W8X756LP8N",
      };
      firebase.initializeApp(firebaseConfig);
    </script>
  </head>
  <body class="light-theme">
    <div class="app">
      <header class="header">
        <div class="header-left">
          <h1>Second Brain.</h1>
          <div class="date-display" id="currentDate"></div>
        </div>
        <div class="header-right">
          <button id="themeToggle" class="theme-toggle">
            <span class="moon">🌙</span>
            <span class="sun">☀️</span>
          </button>
          <button class="logout-btn">Logout</button>
        </div>
      </header>

      <aside class="sidebar">
        <nav>
          <ul>
            <li>
              <a href="index.html" class="nav-link">
                <span class="icon">📆</span>
                <span class="text">Calendar</span>
              </a>
            </li>
            <li>
              <a href="todo.html" class="nav-link">
                <span class="icon">✅</span>
                <span class="text">To-Do</span>
              </a>
            </li>
            <li>
              <a href="journal.html" class="nav-link">
                <span class="icon">📔</span>
                <span class="text">Journal</span>
              </a>
            </li>
            <li class="active">
              <a href="goals.html" class="nav-link">
                <span class="icon">🎯</span>
                <span class="text">Goals</span>
              </a>
            </li>
          </ul>
        </nav>
        <div class="quick-notes">
          <h3>Quick Notes</h3>
          <textarea placeholder="Write down quick thoughts..."></textarea>
        </div>
      </aside>

      <main class="main-content">
        <div class="content-header">
          <h2>Goal Dashboard</h2>
          <button id="addGoalBtn" class="add-event-btn">+ Add Goal</button>
        </div>

        <div class="goal-categories">
          <div class="goal-category" data-category="personal">
            <h3><span class="icon">👤</span> Personal Goals</h3>
            <div class="goal-list" id="personal-goals"></div>
          </div>
          <div class="goal-category" data-category="academic">
            <h3><span class="icon">📚</span> Academic Goals</h3>
            <div class="goal-list" id="academic-goals"></div>
          </div>
          <div class="goal-category" data-category="career">
            <h3><span class="icon">💼</span> Career Goals</h3>
            <div class="goal-list" id="career-goals"></div>
          </div>
        </div>

        <!-- Goal Modal -->
        <div id="goalModal" class="modal">
          <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h3 class="modal-title">Add New Goal</h3>
            <form id="goalForm">
              <input type="hidden" id="goalId" />
              <div class="form-group">
                <label for="goalTitle">Goal Title</label>
                <input type="text" id="goalTitle" required />
              </div>
              <div class="form-group">
                <label for="goalCategory">Category</label>
                <select id="goalCategory" required>
                  <option value="personal">Personal</option>
                  <option value="academic">Academic</option>
                  <option value="career">Career</option>
                </select>
              </div>
              <div class="form-group">
                <label for="goalDescription">Description</label>
                <textarea id="goalDescription" rows="3"></textarea>
              </div>
              <div class="form-group">
                <label for="goalTargetDate">Target Date</label>
                <input type="date" id="goalTargetDate" />
              </div>
              <div class="form-group">
                <label for="goalCurrentProgress">Current Progress (%)</label>
                <input
                  type="number"
                  id="goalCurrentProgress"
                  min="0"
                  max="100"
                  value="0"
                />
              </div>
              <div class="form-group">
                <label for="goalColor">Color</label>
                <select id="goalColor">
                  <option value="#4361ee">Blue</option>
                  <option value="#4cc9f0">Teal</option>
                  <option value="#f72585">Pink</option>
                  <option value="#7209b7">Purple</option>
                  <option value="#f8961e">Orange</option>
                </select>
              </div>
              <button type="submit" class="submit-btn">Save Goal</button>
            </form>
          </div>
        </div>
      </main>
    </div>

    <script src="scripts/goals.js"></script>
  </body>
</html>
