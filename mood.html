    />
    <link rel="stylesheet" href="styles/main.css" />
    <link rel="stylesheet" href="styles/mood.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

        projectId: "noted-abfa8",
        storageBucket: "noted-abfa8.appspot.com",

  </head>
  <body class="light-theme">
    <div class="app">
      <header class="header">
        <div class="header-left">
          <h1>Second Brain.</h1>
          <div class="date-display" id="currentDate"></div>
        </div>
        <div class="header-right">
          <button id="themeToggle" class="theme-toggle">
            <span class="moon">🌙</span>
            <span class="sun">☀️</span>
          </button>
          <button class="logout-btn">Logout</button>
        </div>
      </header>

      <aside class="sidebar">
        <nav>
          <ul>
            <li>
              <a href="index.html" class="nav-link">
                <span class="icon">📆</span>
                <span class="text">Calendar</span>
              </a>
            </li>
            <li>
              <a href="todo.html" class="nav-link">
                <span class="icon">✅</span>
                <span class="text">To-Do</span>
              </a>
            </li>
            <li>
              <a href="journal.html" class="nav-link">
                <span class="icon">📔</span>
                <span class="text">Journal</span>
              </a>
            </li>
            <li>
              <a href="goals.html" class="nav-link">
                <span class="icon">🎯</span>
                <span class="text">Goals</span>
              </a>
            </li>
            <li>
              <a href="habit.html" class="nav-link">
                <span class="icon">🔄</span>
                <span class="text">Habits</span>
              </a>
            </li>
            <li class="active">
              <a href="mood.html" class="nav-link">
                <span class="icon">😊</span>
                <span class="text">Mood</span>
              </a>
            </li>
          </ul>
        </nav>
        <div class="quick-notes">
          <h3>Quick Notes</h3>
          <textarea placeholder="Write down quick thoughts..."></textarea>
        </div>
        <h4>Devloped by Kunal Mali</h4>
      </aside>

      <main class="main-content">
        <div class="content-header">
          <h2>Mood Tracker</h2>
          <!-- <div class="view-controls">
            <button class="view-btn active" data-view="daily">Daily</button>
            <button class="view-btn" data-view="weekly">Weekly</button>
            <button class="view-btn" data-view="monthly">Monthly</button>
          </div> -->
          <div class="view-controls">
            <button class="view-btn active" data-view="daily">Daily</button>
            <button class="view-btn" data-view="weekly">Weekly</button>
            <button class="view-btn" data-view="monthly">Monthly</button>
          </div>
        </div>

        <div class="mood-container">
          <!-- Today's Mood Entry -->
          <div class="mood-entry-card">
            <h3>How are you feeling today?</h3>
            <div class="mood-options">
              <button class="mood-option" data-mood="5" data-color="#4ade80">
                😊 Great
              </button>
              <button class="mood-option" data-mood="4" data-color="#a3e635">
                🙂 Good
              </button>
              <button class="mood-option" data-mood="3" data-color="#facc15">
                😐 Neutral
              </button>
              <button class="mood-option" data-mood="2" data-color="#fb923c">
                😕 Okay
              </button>
              <button class="mood-option" data-mood="1" data-color="#f87171">
                😞 Poor
              </button>
            </div>
            <div class="mood-notes">
              <label for="moodNotes">Notes (optional)</label>
              <textarea
                id="moodNotes"
                placeholder="Add any notes about your mood..."
              ></textarea>
            </div>
            <button id="saveMoodBtn" class="submit-btn">Save Mood</button>
          </div>

          <!-- Mood History -->
          <div class="mood-history">
            <h3>Your Mood History</h3>
            <div class="chart-container">
              <canvas id="moodChart"></canvas>
            </div>
            <div class="mood-entries" id="moodEntries"></div>
          </div>
        </div>
      </main>
    </div>

    <script src="scripts/mood.js"></script>
  </body>
</html>
